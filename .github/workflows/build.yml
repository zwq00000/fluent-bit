name: Build fluent-bit (out_s3 unsigned_payload patch)

on:
  push:
    branches: [out-s3-unsigned-payload-v5.1.1]
  workflow_dispatch:

env:
  IMAGE: registry.graphicsoft.com.cn/library/fluent/fluent-bit:5.1.1-out_s3_patch

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build fluent-bit binary (inside ubuntu:22.04 for glibc match)
        run: |
          docker run --rm -v "$PWD":/src -w /src ubuntu:22.04 bash -c '
            set -e
            apt-get update
            apt-get install -y --no-install-recommends build-essential cmake git flex bison libssl-dev libsystemd-dev ca-certificates
            cmake -B build -S . \
              -DCMAKE_BUILD_TYPE=Release \
              -DFLB_RELEASE=On \
              -DFLB_TESTING=Off \
              -DFLB_BINARY=On \
              -DFLB_JEMALLOC=On \
              -DFLB_SQLDB=On \
              -DFLB_HTTP_SERVER=On \
              -DFLB_BACKTRACE=Off \
              -DFLB_SYSTEMD=Off
            cmake --build build --parallel $(nproc)
            strip build/fluent-bit
          '

      - name: Prepare clean image build context
        run: |
          cp build/fluent-bit docker/fluent-bit
          cp conf/fluent-bit.conf docker/fluent-bit.conf
          ls -lh docker

      - name: Build image
        run: docker build -t "${IMAGE}" docker

      - name: Verify Unsigned_Payload patch is compiled in
        run: |
          if docker run --rm --entrypoint strings "${IMAGE}" | grep -q "Unsigned_Payload"; then
            echo "OK: unsigned_payload symbol present in image binary"
          else
            echo "ERROR: unsigned_payload symbol NOT found in image binary"
            exit 1
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluent-bit
          path: build/fluent-bit

      - name: Login and push to registry (if credentials are configured)
        run: |
          if [ -n "${{ secrets.REGISTRY_USERNAME }}" ]; then
            echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login registry.graphicsoft.com.cn -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin
            docker push "${IMAGE}"
            echo "Pushed ${IMAGE}"
          else
            echo "Skipping login/push: REGISTRY_USERNAME secret is not set."
          fi
