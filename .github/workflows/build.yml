name: Build fluent-bit (out_s3 unsigned_payload patch)

on:
  push:
    branches:
      - 'out-s3-unsigned-payload-v5.1.1'
  workflow_dispatch:

env:
  IMAGE: registry.graphicsoft.com.cn/library/fluent/fluent-bit:5.1.1-out_s3_patch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout source (v5.1.1 based branch)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # NOTE: GitHub rejects workflows that reference the `secrets` context inside
      # `if:` conditionals for fork repositories (workflow is declined at dispatch,
      # resulting in 0 jobs). We therefore gate login/push on the secret at RUNTIME
      # (inside `run:`), not via `if:`.
      - name: Build Docker image (self-contained, ubuntu:22.04)
        run: docker build -t "${IMAGE}" .

      - name: Verify patch compiled into image
        run: |
          echo "fluent-bit version in image:"
          docker run --rm "${IMAGE}" --version
          echo "checking for unsigned_payload option in image binary:"
          docker run --rm "${IMAGE}" sh -c 'strings /usr/local/bin/fluent-bit | grep -i unsigned_payload' \
            && echo "OK: unsigned_payload present" || echo "WARN: unsigned_payload not found in binary"

      - name: Login and push to registry (if credentials provided)
        run: |
          if [ -n "${{ secrets.REGISTRY_USERNAME }}" ]; then
            echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login registry.graphicsoft.com.cn \
              -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin
            docker push "${IMAGE}"
          else
            echo "REGISTRY_USERNAME not set; skipping login/push (image built locally only)."
          fi

      - name: Extract binary artifact
        run: |
          cid=$(docker create "${IMAGE}")
          docker cp "$cid":/usr/local/bin/fluent-bit ./fluent-bit || true
          docker rm "$cid" || true
          ls -lh ./fluent-bit 2>/dev/null || echo "no binary extracted"

      - name: Upload fluent-bit binary
        uses: actions/upload-artifact@v4
        with:
          name: fluent-bit-v5.1.1-unsigned-payload
          path: fluent-bit
          if-no-files-found: warn
