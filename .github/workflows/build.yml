name: Build fluent-bit (out_s3 unsigned_payload patch)

on:
  push:
    branches:
      - 'out-s3-unsigned-payload-v5.1.1'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: registry.graphicsoft.com.cn/library/fluent/fluent-bit:5.1.1-out_s3_patch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout source (v5.1.1 based branch)
        uses: actions/checkout@v4
        with:
          # v5.1.1 vendors all dependencies under lib/, no git submodules required
          submodules: false
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry.graphicsoft.com.cn
        if: ${{ secrets.REGISTRY_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          registry: registry.graphicsoft.com.cn
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build Docker image (self-contained, ubuntu:22.04)
        run: docker build -t "${IMAGE}" .

      - name: Verify patch compiled into image
        run: |
          echo "fluent-bit version in image:"
          docker run --rm "${IMAGE}" --version
          echo "checking for unsigned_payload option in image binary:"
          docker run --rm "${IMAGE}" sh -c 'strings /usr/local/bin/fluent-bit | grep -i unsigned_payload' \
            && echo "OK: unsigned_payload present" || echo "WARN: unsigned_payload not found"

      - name: Push Docker image
        if: ${{ secrets.REGISTRY_USERNAME != '' }}
        run: docker push "${IMAGE}"

      - name: Extract binary artifact (useful even if push is skipped)
        run: |
          cid=$(docker create "${IMAGE}")
          docker cp "$cid":/usr/local/bin/fluent-bit ./fluent-bit
          docker rm "$cid"
          ls -lh ./fluent-bit

      - name: Upload fluent-bit binary
        uses: actions/upload-artifact@v4
        with:
          name: fluent-bit-v5.1.1-unsigned-payload
          path: fluent-bit
          if-no-files-found: error
