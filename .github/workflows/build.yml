name: Build fluent-bit (out_s3 unsigned_payload patch)

on:
  push:
    branches: [out-s3-unsigned-payload-v5.1.1]
  workflow_dispatch:

env:
  IMAGE: fluent-bit:5.1.1-out_s3_patch
  RELEASE_TAG: v5.1.1-out_s3_patch

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build fluent-bit binary (inside ubuntu:22.04 for glibc match)
        run: |
          docker run --rm -v "$PWD":/src -w /src ubuntu:22.04 bash -c '
            set -e
            apt-get update
            apt-get install -y --no-install-recommends build-essential cmake git flex bison libssl-dev libsystemd-dev ca-certificates libyaml-dev
            cmake -B build -S . \
              -DCMAKE_BUILD_TYPE=Release \
              -DFLB_RELEASE=On \
              -DFLB_TESTING=Off \
              -DFLB_BINARY=On \
              -DFLB_JEMALLOC=On \
              -DFLB_SQLDB=On \
              -DFLB_HTTP_SERVER=On \
              -DFLB_BACKTRACE=Off \
              -DFLB_SYSTEMD=Off
            cmake --build build --parallel $(nproc)
            strip build/bin/fluent-bit
          '

      - name: Prepare clean image build context
        run: |
          cp build/bin/fluent-bit docker/fluent-bit
          cp conf/fluent-bit.conf docker/fluent-bit.conf
          ls -lh docker

      - name: Build image
        run: docker build -t "${IMAGE}" -f docker/Dockerfile.runtime docker

      - name: Verify Unsigned_Payload patch is compiled in
        run: |
          if docker run --rm --entrypoint strings "${IMAGE}" | grep -q "Unsigned_Payload"; then
            echo "OK: unsigned_payload symbol present in image binary"
          else
            echo "ERROR: unsigned_payload symbol NOT found in image binary"
            exit 1
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluent-bit
          path: build/bin/fluent-bit

      - name: Export image as tar.gz for release download
        run: |
          docker save "${IMAGE}" | gzip -c > "fluent-bit-5.1.1-out_s3_patch.tar.gz"
          ls -lh "fluent-bit-5.1.1-out_s3_patch.tar.gz"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Fluent Bit 5.1.1 (out_s3 Unsigned_Payload patch)
          body: |
            fluent-bit 5.1.1 含 out_s3 插件 `Unsigned_Payload` 选项补丁。

            使用方式：
            ```bash
            docker load -i fluent-bit-5.1.1-out_s3_patch.tar.gz
            docker run --rm fluent-bit:5.1.1-out_s3_patch -c /etc/fluent-bit/fluent-bit.conf
            ```
          files: fluent-bit-5.1.1-out_s3_patch.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
